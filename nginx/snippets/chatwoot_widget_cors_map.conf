# Include trong context http {} (đầu file vhost Chatwoot, cạnh upstream).
# Echo Origin — không hardcode domain khách.

map $http_origin $cw_widget_cors {
    default "";
    "~*^https://[A-Za-z0-9._-]+(:[0-9]+)?$" $http_origin;
    "~*^http://localhost(:[0-9]+)?$"        $http_origin;
    "~*^http://127\\.0\\.0\\.1(:[0-9]+)?$" $http_origin;
}
