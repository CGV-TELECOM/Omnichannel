# Include bên trong server { listen 443 ... } của Chatwoot.
# Đòi hỏi: upstream backend_chatwoot { server 127.0.0.1:<port>; }
# copy: cp nginx/snippets/*.conf /etc/nginx/snippets/

location ^~ /api/v1/widget/ {
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $cw_widget_cors always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Auth-Token, api_access_token, Accept" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Vary "Origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 204;
    }

    proxy_pass http://backend_chatwoot;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Access-Control-Allow-Origin $cw_widget_cors always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Vary "Origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    proxy_buffering off;
}

location ^~ /widget {
    proxy_pass http://backend_chatwoot;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_hide_header X-Frame-Options;
    add_header X-Content-Type-Options "nosniff" always;
    proxy_buffering off;
}
