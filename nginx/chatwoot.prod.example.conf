# Mẫu gắn CORS widget lên Chatwoot PROD (host nginx khác devchat).
# Không deploy file này nguyên khối — chỉ copy 3 khối đánh dấu vào vhost hiện tại.
#
# Trên server prod:
#   CHATWOOT_NGINX_VHOST=/etc/nginx/sites-available/<prod> \
#     bash scripts/install_chatwoot_widget_cors.sh
# hoặc copy tay:
#   cp nginx/snippets/chatwoot_widget_cors_*.conf /etc/nginx/snippets/
#   nginx -t && systemctl reload nginx
#
# Dev đã live: nginx/devchat.telesip.vn.conf (devchat.telesip.vn).

# --- 1) http context (cùng cấp upstream, NGOÀI server {}) ---
# include /etc/nginx/snippets/chatwoot_widget_cors_map.conf;

# --- 2) trong server listen 443, TRƯỚC location / ---
# include /etc/nginx/snippets/chatwoot_widget_cors_locations.conf;

# Upstream phải tên backend_chatwoot (snippet proxy_pass dùng tên này).
# Nếu prod đặt tên khác: sửa snippets hoặc alias:
# upstream backend_chatwoot { server 127.0.0.1:<chatwoot_port>; }
