# Nginx configuration for devchat.telesip.vn
# Chatwoot Web App running on port 3010
# Chatservice API running on port 8001
#
# Widget CORS: SDK trên domain khách gọi POST /api/v1/widget/config (preflight OPTIONS).
# Echo Origin động — không hardcode từng domain khách mới.
# Allowed Domains trên inbox Chatwoot = CSP iframe, KHÔNG thay CORS nginx.

# Reflect bất kỳ Origin hợp lệ (https://host hoặc localhost) — nhiều tenant / nhiều site.
map $http_origin $cw_widget_cors {
    default "";
    "~*^https://[A-Za-z0-9._-]+(:[0-9]+)?$" $http_origin;
    "~*^http://localhost(:[0-9]+)?$"        $http_origin;
    "~*^http://127\\.0\\.0\\.1(:[0-9]+)?$" $http_origin;
}

upstream backend_chatwoot {
    server 127.0.0.1:3010;
    keepalive 64;
}

upstream backend_chatservice {
    server 127.0.0.1:8001;
    keepalive 64;
}

# HTTP server - for Let's Encrypt validation and redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name devchat.telesip.vn;

    # Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP requests to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name devchat.telesip.vn;

    # SSL Configuration - Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/devchat.telesip.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devchat.telesip.vn/privkey.pem;
    
    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Logging
    access_log /var/log/nginx/devchat.telesip.vn.access.log;
    error_log /var/log/nginx/devchat.telesip.vn.error.log;

    # Client body size limit (for file uploads)
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Timeouts
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 600;

    # Chatservice specific API endpoints (Zalo & webhook integration)
    location ~ ^/api/v1/(zalo-oa-configs|zalo/|chatwoot/webhook) {
        proxy_pass http://backend_chatservice;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ActionCable WebSocket support (Chatwoot real-time connection)
    location /cable {
        proxy_pass http://backend_chatwoot;
        proxy_http_version 1.1;
        
        # WebSocket specific headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts for WebSocket
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        
        proxy_buffering off;
    }

    # Live-chat widget API (CORS cho mọi domain khách nhúng SDK)
    location ^~ /api/v1/widget/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cw_widget_cors always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Auth-Token, api_access_token, Accept" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Vary "Origin" always;
            add_header X-Content-Type-Options "nosniff" always;
            return 204;
        }

        proxy_pass http://backend_chatwoot;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $cw_widget_cors always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary "Origin" always;
        add_header X-Content-Type-Options "nosniff" always;

        proxy_buffering off;
    }

    # Iframe widget: không gắn X-Frame-Options SAMEORIGIN (để Chatwoot CSP / Allowed Domains quyết định)
    location ^~ /widget {
        proxy_pass http://backend_chatwoot;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_hide_header X-Frame-Options;
        add_header X-Content-Type-Options "nosniff" always;

        proxy_buffering off;
    }

    # All other endpoints (Chatwoot Dashboard and Rails API)
    location / {
        proxy_pass http://backend_chatwoot;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_buffering off;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
