<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>{{ subject }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f6f9fc;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
        }

        .header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .header h2 {
            margin: 0;
            color: #333;
        }

        .content {
            margin-top: 20px;
            line-height: 1.6;
            color: #444;
        }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #999;
            text-align: center;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        a.button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 5px;
        }

        a.button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h2>Xin chào {{ user_name }},</h2>
        </div>

        <div class="content">
            <p>Cảm ơn bạn đã đăng ký sử dụng dịch vụ của chúng tôi.</p>
            <p>{{ message }}</p>

            {% if action_url %}
            <a href="{{ action_url }}" class="button">{{ action_text or 'Truy cập ngay' }}</a>
            {% endif %}
        </div>

        <div class="footer">
            &copy; {{ current_year }} {{ company_name or 'Tên công ty' }}. Mọi quyền được bảo lưu.
        </div>
    </div>
</body>

</html>
